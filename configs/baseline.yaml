# Experimento baseline — Opção 1 (feature extraction)

experiment:
  name: "baseline_feature_extraction"
  seed: 42

data:
  source: "hemg"
  batch_size: 64
  num_workers: 4
  max_samples_train: null   # null = usa o dataset todo
  max_samples_val: null

model:
  num_classes: 1
  pretrained: true
  freeze_backbone: true     # OPÇÃO 1
  dropout: 0.5

training:
  epochs: 10
  optimizer:
    name: "adam"
    lr: 0.001               # LR maior pra Opção 1 (só treina head)
    weight_decay: 0.0001
  scheduler:
    name: "cosine"
    eta_min: 0.00001
  amp: true
  early_stopping:
    patience: 3
    monitor: "val_auc"
    mode: "max"

logging:
  output_dir: "runs"