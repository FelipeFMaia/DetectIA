[project]
name = "detectia"
version = "0.1.0"
description = "Detector de imagens geradas por IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",          # Framework de deep learning
    "torchvision>=0.16.0",   # Modelos pré-treinados (ResNet, etc) e transforms
    "datasets>=2.14.0",      # HuggingFace datasets (carrega o Hemg)
    "numpy>=1.24.0",
    "pillow>=10.0.0",        # Manipulação de imagens
    "scikit-learn>=1.3.0",   # Métricas (AUC, classification_report)
    "matplotlib>=3.7.0",     # Plots
    "seaborn>=0.12.0",       # Plots mais bonitos (matriz de confusão)
    "tqdm>=4.65.0",          # Barras de progresso
    "tensorboard>=2.14.0",   # Logging de treino
    "pyyaml>=6.0",           # Carregar configs
    "torchmetrics>=1.0.0",   # Métricas otimizadas pra PyTorch
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",           # Linter + formatter
    "ipykernel>=6.25.0",     # Pra rodar notebooks
    "jupyterlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detectia"]

[tool.ruff]
line-length = 100
target-version = "py311"